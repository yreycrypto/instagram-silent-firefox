<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instagram /silent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <label class="row" for="toggle">
      <span class="title" id="title">/silent mode</span>
      <span class="switch">
        <input id="toggle" type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
    <p class="hint" id="status" aria-live="polite"></p>

    <details>
      <summary id="advanced"></summary>
      <label for="command" id="commandLabel"></label>
      <input id="command" type="text" maxlength="32" spellcheck="false" autocomplete="off">
      <p class="hint" id="commandHint"></p>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
